<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评分详情 · 李斯特国际青少年钢琴大赛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 评分详情页专属样式 */
    .detail-shell {
      max-width: 1180px; margin: 0 auto; padding: 36px 28px 80px;
    }
    .back-bar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px;
      font-size: .9rem;
      color: var(--color-text-dim);
    }
    .back-bar a { color: var(--color-gold-2); }
    .back-bar a:hover { color: var(--color-gold); }

    .work-hero {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 28px;
      background: linear-gradient(180deg, rgba(28,24,18,.92), rgba(20,17,13,.92));
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 28px;
    }
    @media (max-width: 820px) { .work-hero { grid-template-columns: 1fr; } }

    .work-hero .video-frame {
      aspect-ratio: 16/9; background: #000;
      border-radius: var(--radius-sm); overflow: hidden;
      display: grid; place-items: center;
      color: var(--color-text-dim);
    }

    .work-info h1 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      margin-bottom: 8px;
    }
    .work-info .meta-line { color: var(--color-text-dim); font-size: .9rem; }
    .work-info .notes {
      margin-top: 18px; padding: 14px 16px;
      background: rgba(12,10,8,.4);
      border-left: 3px solid var(--color-gold);
      border-radius: 4px;
      color: var(--color-text-2);
      font-size: .92rem; line-height: 1.7;
    }
    .score-overview {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .score-overview .box {
      background: rgba(12,10,8,.5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 14px;
      text-align: center;
    }
    .score-overview .num {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: var(--color-gold-2);
      font-weight: 700;
      line-height: 1;
    }
    .score-overview .label {
      font-size: .78rem;
      color: var(--color-text-dim);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .radar-wrap {
      background: rgba(12,10,8,.4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      margin-top: 14px;
    }
    .radar-wrap h4 {
      font-family: var(--font-serif);
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .judge-detail-card {
      background: linear-gradient(180deg, rgba(28,24,18,.92), rgba(20,17,13,.92));
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 26px 28px;
      margin-bottom: 18px;
    }
    .judge-detail-head {
      display: flex; gap: 16px; align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 18px;
    }
    .judge-detail-head .avatar-xl {
      width: 60px; height: 60px; border-radius: 50%;
      display: grid; place-items: center;
      color: #1a1410; font-weight: 700; font-size: 1.4rem;
      flex-shrink: 0;
    }
    .judge-detail-head h3 {
      margin: 0 0 4px;
      font-family: var(--font-serif);
      color: var(--color-text);
    }
    .judge-detail-head .sub {
      color: var(--color-text-dim); font-size: .85rem;
    }
    .judge-detail-head .score-pill {
      font-size: 1.1rem; padding: 8px 16px;
    }

    .judge-comment-block {
      background: rgba(12,10,8,.5);
      border-left: 3px solid var(--color-gold);
      padding: 16px 20px;
      border-radius: 4px;
      margin: 16px 0;
    }
    .judge-comment-block .label {
      font-size: .75rem; color: var(--color-text-dim);
      letter-spacing: .12em; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .judge-comment-block p { margin: 0; color: var(--color-text); line-height: 1.75; }

    .reply-block {
      background: rgba(200,164,92,.06);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      margin-top: 14px;
    }
    .reply-block .label {
      font-size: .75rem; color: var(--color-gold-2);
      letter-spacing: .12em; text-transform: uppercase;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-logo">L</span>
      <span>Liszt IPC<small>评分详情</small></span>
    </a>
    <nav class="nav-links"></nav>
    <div class="nav-spacer"></div>
    <div class="nav-actions"></div>
  </div>
</header>

<main class="detail-shell">
  <div class="back-bar">
    <a href="result.html">← 返回我的成绩</a>
    <span>·</span>
    <span>评分详情</span>
  </div>

  <div id="content"></div>
</main>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalInner"></div></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/score-detail.js"></script>
</body>
</html>
