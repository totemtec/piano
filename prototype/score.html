<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>评审打分 · 李斯特国际青少年钢琴大赛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--color-bg); }
    .score-shell {
      max-width: 1340px; margin: 0 auto; padding: 18px 18px 80px;
    }

    /* 评委信息条 */
    .jhead {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      background: linear-gradient(135deg, rgba(200,164,92,.14), rgba(20,17,13,.4));
      border: 1px solid var(--color-border-strong);
      border-radius: 14px;
      padding: 16px 22px; margin-bottom: 18px;
    }
    .jhead .av {
      width: 52px; height: 52px; border-radius: 50%;
      display: grid; place-items: center;
      color: #1a1410; font-weight: 700; font-size: 1.3rem;
      flex-shrink: 0;
    }
    .jhead .info { flex: 1; min-width: 200px; }
    .jhead h1 { margin: 0 0 2px; font-family: var(--font-serif); font-size: 1.4rem; }
    .jhead .sub { color: var(--color-text-dim); font-size: .88rem; }
    .jhead .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .jhead .stat {
      background: rgba(12,10,8,.5); border: 1px solid var(--color-border);
      border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 78px;
    }
    .jhead .stat .n { font-family: var(--font-serif); font-size: 1.2rem; color: var(--color-gold-2); font-weight: 700; line-height: 1; }
    .jhead .stat .l { font-size: .68rem; color: var(--color-text-dim); letter-spacing: .05em; text-transform: uppercase; margin-top: 4px; }

    /* 进度 */
    .progress-wrap {
      width: 100%; flex: 1 1 100%;
      background: rgba(12,10,8,.5); border-radius: 8px;
      padding: 10px 14px; margin-top: 6px;
    }
    .progress-text { display: flex; justify-content: space-between; font-size: .8rem; color: var(--color-text-dim); margin-bottom: 4px; }
    .progress-text strong { color: var(--color-gold-2); }
    .progress-bar { height: 6px; background: rgba(12,10,8,.6); border-radius: 999px; overflow: hidden; }
    .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--color-gold-3), var(--color-gold-2)); transition: width .3s; }

    /* 主区：左右分栏 / 移动端单列 */
    .score-grid {
      display: grid; grid-template-columns: 320px 1fr; gap: 18px;
    }
    @media (max-width: 960px) { .score-grid { grid-template-columns: 1fr; } }

    /* 待评列表 */
    .pending-list {
      background: rgba(20,17,13,.6); border: 1px solid var(--color-border);
      border-radius: 14px; padding: 14px;
      align-self: start; max-height: 78vh;
      display: flex; flex-direction: column;
    }
    .pending-list h3 {
      margin: 0 0 10px; font-size: .82rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--color-text-dim);
    }
    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--color-border); }
    .filter-bar select, .filter-bar input {
      background: rgba(12,10,8,.6); border: 1px solid var(--color-border); color: var(--color-text);
      padding: 5px 8px; border-radius: 4px; font-size: .82rem;
    }
    .filter-bar input { flex: 1; min-width: 100px; }
    .list-scroll { overflow-y: auto; flex: 1; }
    .pending-item {
      display: block; padding: 10px 12px; border-radius: 10px;
      background: rgba(12,10,8,.4); border: 1px solid var(--color-border);
      margin-bottom: 6px; cursor: pointer; transition: all .2s;
    }
    .pending-item:hover { background: rgba(200,164,92,.06); }
    .pending-item.active { background: rgba(200,164,92,.18); border-color: var(--color-gold); }
    .pending-item .t { font-weight: 600; font-size: .92rem; }
    .pending-item .s { color: var(--color-text-dim); font-size: .78rem; margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
    .pending-item .badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: .68rem;
      background: rgba(200,164,92,.18); color: var(--color-gold-2);
    }
    .pending-item.scored { opacity: .6; }
    .pending-item.scored .badge { background: rgba(79,157,111,.2); color: #b6e3c8; }

    /* 评分主区 */
    .score-main {
      background: linear-gradient(180deg, rgba(28,24,18,.85), rgba(20,17,13,.85));
      border: 1px solid var(--color-border); border-radius: 14px;
      padding: 22px 26px;
    }
    .score-main h2 { margin: 0 0 6px; font-family: var(--font-serif); font-size: 1.5rem; }
    .meta-line { color: var(--color-text-dim); font-size: .88rem; margin-bottom: 14px; }
    .meta-line strong { color: var(--color-text-2); margin-right: 4px; }
    .meta-line .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; background: rgba(200,164,92,.15); color: var(--color-gold-2); font-size: .78rem; }

    .video-frame {
      width: 100%; aspect-ratio: 16/9; max-height: 420px;
      background: #0a0805; border-radius: 10px; margin: 12px 0 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .video-frame video { width: 100%; height: 100%; border-radius: 10px; }

    /* 4 维度评分 */
    .dim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 16px 0; }
    @media (max-width: 600px) { .dim-grid { grid-template-columns: 1fr; } }
    .dim-block {
      background: rgba(12,10,8,.5); border: 1px solid var(--color-border);
      border-radius: 10px; padding: 14px 16px;
    }
    .dim-block .lbl-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .dim-block .nm { font-weight: 600; font-size: .98rem; }
    .dim-block .nm .pct { font-size: .7rem; color: var(--color-text-dim); font-weight: 400; margin-left: 6px; }
    .dim-block .val { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 700; }
    .dim-block input[type=range] {
      width: 100%; -webkit-appearance: none; height: 6px; border-radius: 999px;
      background: rgba(200,164,92,.2); outline: none; margin: 6px 0;
    }
    .dim-block input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: var(--color-gold-2); border: 3px solid var(--color-bg);
      box-shadow: 0 0 0 1px var(--color-gold);
      cursor: pointer;
    }
    .dim-block input[type=range]::-moz-range-thumb {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--color-gold-2); border: 3px solid var(--color-bg);
      cursor: pointer;
    }
    .dim-block .desc { font-size: .76rem; color: var(--color-text-dim); line-height: 1.5; margin-top: 6px; }
    .dim-block .scale { display: flex; justify-content: space-between; font-size: .68rem; color: var(--color-text-dim); margin-top: 2px; }

    /* 综合分 */
    .overall-box {
      display: flex; align-items: center; gap: 18px;
      background: linear-gradient(135deg, rgba(200,164,92,.18), rgba(200,164,92,.04));
      border: 1px solid var(--color-gold); border-radius: 12px;
      padding: 16px 22px; margin: 16px 0;
    }
    .overall-box .n {
      font-family: var(--font-serif); font-size: 2.4rem; font-weight: 700;
      color: var(--color-gold-2); line-height: 1;
    }
    .overall-box .lbl { color: var(--color-text-dim); font-size: .82rem; }
    .overall-box .formula { flex: 1; font-size: .76rem; color: var(--color-text-dim); text-align: right; }

    /* 评语 */
    .comment-block { margin-top: 16px; }
    .comment-block label { display: block; font-size: .88rem; color: var(--color-text-2); margin-bottom: 6px; }
    .comment-block textarea {
      width: 100%; min-height: 130px; resize: vertical;
      background: rgba(12,10,8,.5); border: 1px solid var(--color-border);
      color: var(--color-text); padding: 12px 14px; border-radius: 10px;
      font-family: inherit; font-size: .95rem; line-height: 1.6;
    }
    .comment-block textarea:focus { outline: none; border-color: var(--color-gold); }
    .comment-block .meta { display: flex; justify-content: space-between; font-size: .78rem; color: var(--color-text-dim); margin-top: 4px; }

    .template-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .template-chip {
      padding: 5px 12px; border-radius: 999px;
      background: rgba(200,164,92,.1); border: 1px solid var(--color-border);
      color: var(--color-text-2); cursor: pointer; font-size: .82rem;
      transition: all .2s;
    }
    .template-chip:hover { background: rgba(200,164,92,.2); color: var(--color-gold-2); }

    /* 签字 */
    .signature-block {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; margin-top: 16px;
      background: rgba(200,164,92,.06);
      border: 1px dashed rgba(200,164,92,.35);
      border-radius: 10px;
      gap: 12px; flex-wrap: wrap;
    }
    .signature-block .sig-text {
      font-family: 'Brush Script MT', 'STKaiti', 'KaiTi', 'KaiTi_GB2312', cursive;
      font-size: 1.8rem; color: var(--color-gold-2);
      letter-spacing: .04em; transform: rotate(-2deg);
      display: inline-block;
    }
    .signature-block .sig-info { font-size: .78rem; color: var(--color-text-dim); }

    /* 操作栏 */
    .actions-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .actions-bar .btn { flex: 1; min-width: 140px; }

    .mobile-tabs { display: none; gap: 6px; margin-bottom: 12px; }
    .mobile-tabs button {
      flex: 1; padding: 9px; border-radius: 8px;
      background: rgba(20,17,13,.6); border: 1px solid var(--color-border);
      color: var(--color-text-2); cursor: pointer; font-family: inherit;
      font-size: .88rem; transition: all .2s;
    }
    .mobile-tabs button.active { background: var(--color-gold); color: #1a1410; border-color: var(--color-gold); }

    @media (max-width: 960px) {
      .mobile-tabs { display: flex; }
      .pending-list { display: none; }
      .pending-list.mobile-show { display: flex; max-height: 50vh; }
      .score-main { display: block; }
      .score-main.mobile-hide { display: none; }
    }

    @media (max-width: 480px) {
      .jhead { padding: 12px 14px; }
      .jhead h1 { font-size: 1.2rem; }
      .score-main { padding: 16px 14px; }
      .overall-box { padding: 12px 14px; }
      .overall-box .n { font-size: 2rem; }
    }

    .empty-state {
      padding: 60px 20px; text-align: center; color: var(--color-text-dim);
    }
    .empty-state .ic { font-size: 4rem; margin-bottom: 16px; }
  </style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-logo">L</span>
      <span>Liszt IPC<small>评审打分</small></span>
    </a>
    <nav class="nav-links" data-managed="1">
      <a href="review-login.html">切换账号</a>
      <a href="index.html">首页</a>
    </nav>
    <div class="nav-spacer"></div>
    <div class="nav-actions"></div>
  </div>
</header>

<main class="score-shell">
  <!-- 评委信息条 -->
  <div class="jhead" id="jhead"></div>

  <!-- 移动端：列表 / 评分 切换 -->
  <div class="mobile-tabs">
    <button class="active" data-mt="main">📝 评分</button>
    <button data-mt="list">📋 作品列表</button>
  </div>

  <div class="score-grid">
    <!-- 左侧：待评列表 -->
    <aside class="pending-list" id="pendingList">
      <h3>作品列表</h3>
      <div class="filter-bar">
        <select id="filterGroup">
          <option value="">全部组别</option>
          <option>儿童组</option>
          <option>少年组</option>
          <option>青年组</option>
          <option>专业组</option>
        </select>
        <select id="filterMajor">
          <option value="">全部专业</option>
          <option value="piano">🎹 钢琴</option>
          <option value="vocal">🎤 声乐</option>
          <option value="instrument">🎻 器乐</option>
        </select>
        <input type="text" id="filterText" placeholder="搜索姓名/作品…">
        <select id="filterStatus">
          <option value="pending">待评</option>
          <option value="scored">已评</option>
          <option value="all">全部</option>
        </select>
      </div>
      <div class="list-scroll" id="listScroll"></div>
    </aside>

    <!-- 右侧：评分表单 -->
    <section class="score-main" id="scoreMain">
      <div class="empty-state" id="emptyState">
        <div class="ic">📋</div>
        <p>请从左侧选择一件作品开始打分</p>
      </div>
    </section>
  </div>
</main>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalInner"></div></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  'use strict';

  const me = LisztAuth.current;
  if (!me) { location.href = 'review-login.html'; return; }
  if (me.role !== 'judge') { location.href = me.role === 'admin' ? 'admin.html' : 'result.html'; return; }

  const judge = LisztData.SEED_JUDGES.find(j => j.id === me.judgeId) || { name: me.name, initial: (me.name || '评').slice(0,1), avatarColor: 'linear-gradient(135deg, #c8a45c, #8a6a2c)', title: '评委' };
  const MAJORS = LisztData.MAJORS;

  // =============== 状态（动态读取，提交后自动刷新）===============
  const videos = LisztStore.getVideos();
  const allVideos = videos; // 兼容旧名，避免过滤时报 ReferenceError
  const myScoredIds = new Set(LisztStore.getScores().filter(s => s.judgeId === judge.id).map(s => s.videoId));

  let currentVid = null;
  let draftKey = 'liszt_score_draft';
  const DRAFT = {};    // {vid: {dims, comment}}

  function getMyScores() { return LisztStore.getScores().filter(s => s.judgeId === judge.id); }
  function getPendingVideos() { return videos.filter(v => !myScoredIds.has(v.id)); }
  function getScoredVideos() { return videos.filter(v => myScoredIds.has(v.id)); }
  function getMyScore(vid) { return getMyScores().find(s => s.videoId === vid); }

  // =============== 头部 ===============
  function renderHead() {
    const pending = getPendingVideos();
    const scored = getScoredVideos();
    document.getElementById('jhead').innerHTML = `
      <div class="av" style="background: ${judge.avatarColor}">${LisztUtil.escape(judge.initial || '评')}</div>
      <div class="info">
        <h1>${LisztUtil.escape(judge.name)}</h1>
        <div class="sub">${LisztUtil.escape(judge.title || judge.role || '评委')}</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="n">${pending.length}</div><div class="l">待评审</div></div>
        <div class="stat"><div class="n">${scored.length}</div><div class="l">已完成</div></div>
        <div class="stat"><div class="n">${videos.length}</div><div class="l">总数</div></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-text">
          <span>评审进度：<strong>${scored.length}</strong> / ${videos.length}</span>
          <span>${Math.round(scored.length / Math.max(1, videos.length) * 100)}%</span>
        </div>
        <div class="progress-bar"><div style="width: ${scored.length / Math.max(1, videos.length) * 100}%"></div></div>
      </div>
    `;
  }

  // =============== 列表 ===============
  function getFiltered() {
    const g = document.getElementById('filterGroup').value;
    const m = document.getElementById('filterMajor').value;
    const t = document.getElementById('filterText').value.trim().toLowerCase();
    const s = document.getElementById('filterStatus').value;
    return allVideos.filter(v => {
      if (g && v.group !== g) return false;
      if (m && v.major !== m) return false;
      const u = LisztStore.findUser(u => u.id === v.contestantId) || {};
      if (t && !(v.title.toLowerCase().includes(t) || (v.composer || '').toLowerCase().includes(t) || (u.name || '').toLowerCase().includes(t))) return false;
      if (s === 'pending' && myScoredIds.has(v.id)) return false;
      if (s === 'scored' && !myScoredIds.has(v.id)) return false;
      return true;
    });
  }

  function renderList() {
    const list = getFiltered();
    const wrap = document.getElementById('listScroll');
    if (!list.length) {
      wrap.innerHTML = `<p class="muted" style="text-align:center; padding: 30px 0; font-size:.85rem;">无匹配作品</p>`;
      return;
    }
    wrap.innerHTML = list.map(v => {
      const u = LisztStore.findUser(u => u.id === v.contestantId) || {};
      const major = MAJORS.find(x => x.key === v.major) || {};
      const isScored = myScoredIds.has(v.id);
      const myScore = getMyScore(v.id);
      return `
        <a class="pending-item ${currentVid === v.id ? 'active' : ''} ${isScored ? 'scored' : ''}" data-vid="${v.id}">
          <div class="t">${LisztUtil.escape(v.title)}</div>
          <div class="s">
            <span>${LisztUtil.escape(u.name || '—')}</span>
            <span>·</span>
            <span>${major.icon || ''} ${LisztUtil.escape(major.label || '—')}</span>
            <span>·</span>
            <span>${LisztUtil.escape(v.group)}</span>
            <span class="badge">${isScored ? '★ ' + myScore.overall.toFixed(2) : '待评'}</span>
          </div>
        </a>
      `;
    }).join('');
    wrap.querySelectorAll('[data-vid]').forEach(el => {
      el.addEventListener('click', () => {
        currentVid = el.dataset.vid;
        renderList();
        renderMain();
        // 移动端：切换到评分视图
        if (window.innerWidth <= 960) {
          document.getElementById('pendingList').classList.remove('mobile-show');
          document.getElementById('scoreMain').classList.remove('mobile-hide');
          document.querySelectorAll('.mobile-tabs button').forEach(b => b.classList.remove('active'));
          document.querySelector('.mobile-tabs [data-mt="main"]').classList.add('active');
        }
      });
    });
  }

  // =============== 评分主区 ===============
  function renderMain() {
    const wrap = document.getElementById('scoreMain');
    if (!currentVid) {
      wrap.innerHTML = `<div class="empty-state"><div class="ic">📋</div><p>请从左侧选择一件作品开始打分</p></div>`;
      return;
    }
    const v = allVideos.find(x => x.id === currentVid);
    if (!v) {
      wrap.innerHTML = `<div class="empty-state"><div class="ic">⚠</div><p>未找到该作品</p></div>`;
      return;
    }
    const u = LisztStore.findUser(u => u.id === v.contestantId) || {};
    const major = MAJORS.find(x => x.key === v.major) || { label: '—', icon: '' };
    const existingScore = getMyScore(v.id);
    const draft = DRAFT[v.id] || loadDraft(v.id) || {};
    const initial = {
      technical: 8.0, musicality: 8.0, artistry: 8.0, interpretation: 8.0,
      comment: '',
      ...draft
    };
    if (existingScore) {
      ['technical', 'musicality', 'artistry', 'interpretation', 'comment'].forEach(k => {
        if (k === 'comment') initial.comment = existingScore.comment;
        else initial[k] = existingScore[k];
      });
    }
    DRAFT[v.id] = initial;

    wrap.innerHTML = `
      <h2>${LisztUtil.escape(v.title)}</h2>
      <div class="meta-line">
        <strong>选手：</strong>${LisztUtil.escape(u.name || '—')}
        &nbsp;·&nbsp; <strong>组别：</strong><span class="tag">${LisztUtil.escape(v.group)}</span>
        &nbsp;·&nbsp; <strong>专业：</strong>${major.icon || ''} ${LisztUtil.escape(major.label)}
        &nbsp;·&nbsp; <strong>作品：</strong>${LisztUtil.escape(v.title)}
        &nbsp;·&nbsp; <strong>作曲家：</strong>${LisztUtil.escape(v.composer || '—')}
      </div>

      <div class="video-frame" id="videoFrame">
        <div style="text-align:center; color: var(--color-text-dim);"><div style="font-size: 3rem;">🎬</div><p>视频文件未上传（演示场景）</p></div>
      </div>

      ${v.intro ? `<div style="margin-bottom: 14px; padding: 10px 14px; background: rgba(200,164,92,.06); border-left: 3px solid var(--color-gold); border-radius: 4px; font-size: .88rem; color: var(--color-text-2);"><strong>作品介绍：</strong>${LisztUtil.escape(v.intro)}</div>` : ''}

      <div class="dim-grid" id="dimGrid">
        ${LisztData.SCORE_DIMS.map(d => `
          <div class="dim-block">
            <div class="lbl-row">
              <span class="nm">${d.label} <span class="pct">权重 ${(d.weight*100).toFixed(0)}%</span></span>
              <span class="val" id="val-${d.key}">${(initial[d.key] || 0).toFixed(1)}</span>
            </div>
            <input type="range" min="0" max="10" step="0.1" data-dim="${d.key}" value="${initial[d.key] || 8}">
            <div class="scale"><span>0.0</span><span>5.0</span><span>10.0</span></div>
            <div class="desc">${LisztUtil.escape(d.desc)}</div>
          </div>
        `).join('')}
      </div>

      <div class="overall-box">
        <div>
          <div class="n" id="overallN">${calcOverall(initial).toFixed(2)}</div>
          <div class="lbl">综合评分 / 10.00</div>
        </div>
        <div class="formula" id="overallFormula">
          ${LisztData.SCORE_DIMS.map(d => `${d.short} ${(initial[d.key]||0).toFixed(1)}×${(d.weight*100).toFixed(0)}%`).join(' + ')}
        </div>
      </div>

      <div class="comment-block">
        <label>评语 <span class="muted" style="font-size:.78rem;">（≥ 30 字）</span></label>
        <div class="template-row">
          ${LisztData.COMMENT_TEMPLATES.map((t, i) => `<span class="template-chip" data-tpl="${i}">📋 ${t.title}</span>`).join('')}
        </div>
        <textarea id="commentText" placeholder="请输入您对选手的详细评语，包括优点、不足与建议...">${LisztUtil.escape(initial.comment || '')}</textarea>
        <div class="meta"><span id="commentCount">${(initial.comment || '').length} 字</span><span>快捷键 Ctrl+Enter 提交</span></div>
      </div>

      <div class="signature-block">
        <div>
          <span class="sig-text">${LisztUtil.escape(judge.name.replace(/\s+/g, ''))}</span>
        </div>
        <div class="sig-info">评委签字 · 将随评语一同保存${existingScore ? '（已修改将覆盖）' : ''}</div>
      </div>

      <div class="actions-bar">
        <button class="btn btn-ghost" id="btnCancel">返回列表</button>
        <button class="btn btn-primary" id="btnSubmit">${existingScore ? '✓ 保存修改' : '✓ 提交并评审下一件'}</button>
      </div>
    `;

    // 异步加载视频
    LisztVideoLoader.getObjectURL(v.id).then(url => {
      if (url) {
        document.getElementById('videoFrame').innerHTML = `<video controls src="${url}"></video>`;
      }
    }).catch(() => {});

    bindMainEvents();
  }

  function calcOverall(d) {
    return LisztData.SCORE_DIMS.reduce((acc, dim) => acc + (d[dim.key] || 0) * dim.weight, 0);
  }

  function bindMainEvents() {
    // 维度滑块
    document.querySelectorAll('#dimGrid input[type=range]').forEach(inp => {
      inp.addEventListener('input', () => {
        const k = inp.dataset.dim;
        const v = parseFloat(inp.value);
        DRAFT[currentVid][k] = v;
        document.getElementById('val-' + k).textContent = v.toFixed(1);
        document.getElementById('overallN').textContent = calcOverall(DRAFT[currentVid]).toFixed(2);
        document.getElementById('overallFormula').textContent =
          LisztData.SCORE_DIMS.map(d => `${d.short} ${(DRAFT[currentVid][d.key]||0).toFixed(1)}×${(d.weight*100).toFixed(0)}%`).join(' + ');
        saveDraft();
      });
    });
    // 评语
    const cmt = document.getElementById('commentText');
    cmt.addEventListener('input', () => {
      DRAFT[currentVid].comment = cmt.value;
      document.getElementById('commentCount').textContent = cmt.value.length + ' 字';
      saveDraft();
    });
    // 模板
    document.querySelectorAll('[data-tpl]').forEach(c => {
      c.addEventListener('click', () => {
        const tpl = LisztData.COMMENT_TEMPLATES[parseInt(c.dataset.tpl, 10)];
        if (!tpl) return;
        cmt.value = (cmt.value.trim() ? cmt.value.trim() + '\n\n' : '') + tpl.body;
        DRAFT[currentVid].comment = cmt.value;
        document.getElementById('commentCount').textContent = cmt.value.length + ' 字';
        saveDraft();
        LisztUtil.toast('已填充模板：' + tpl.title, 'info');
      });
    });
    // 取消
    document.getElementById('btnCancel').addEventListener('click', () => {
      currentVid = null;
      renderList();
      renderMain();
    });
    // 提交
    document.getElementById('btnSubmit').addEventListener('click', submitScore);
  }

  // 草稿
  function saveDraft() {
    try { localStorage.setItem(draftKey, JSON.stringify(DRAFT)); } catch (e) {}
  }
  function loadDraft(vid) {
    try { return JSON.parse(localStorage.getItem(draftKey) || '{}')[vid]; } catch (e) { return null; }
  }

  // =============== 提交 ===============
  function submitScore() {
    const d = DRAFT[currentVid];
    if (!d) return;
    if (!d.comment || d.comment.trim().length < 30) {
      LisztUtil.toast('评语至少 30 字', 'error');
      document.getElementById('commentText').focus();
      return;
    }
    const overall = calcOverall(d);
    const allScores = LisztStore.getScores();
    const existing = allScores.find(s => s.videoId === currentVid && s.judgeId === judge.id);
    const scoreData = {
      technical: d.technical,
      musicality: d.musicality,
      artistry: d.artistry,
      interpretation: d.interpretation,
      overall,
      comment: d.comment.trim(),
      signature: judge.name.replace(/\s+/g, ''),
      judgeName: judge.name,
      judgeId: judge.id,
      scoredAt: new Date().toISOString()
    };
    if (existing) {
      Object.assign(existing, scoreData);
    } else {
      allScores.push({ id: LisztStore.uid('s'), videoId: currentVid, ...scoreData });
    }
    LisztStore.setScores(allScores);
    // 更新 video 状态
    const videosArr = LisztStore.getVideos();
    const v = videosArr.find(x => x.id === currentVid);
    if (v) {
      const vScores = allScores.filter(s => s.videoId === currentVid);
      v.status = vScores.length >= LisztData.JUDGES_PER_VIDEO ? 'scored' : 'reviewing';
      LisztStore.setVideos(videosArr);
    }
    // 清除草稿
    delete DRAFT[currentVid];
    saveDraft();

    LisztUtil.toast('评分已提交', 'success');

    // 跳到下一件
    const next = videos.find(x => x.id !== currentVid && !myScoredIds.has(x.id));
    // 更新本地集合
    myScoredIds.add(currentVid);
    renderHead();
    renderList();
    if (next) {
      currentVid = next.id;
      renderMain();
    } else {
      // 全部完成
      currentVid = null;
      renderMain();
      LisztModal.open(`
        <div style="text-align:center; padding: 30px 20px;">
          <div style="font-size: 4rem; margin-bottom: 12px;">🎉</div>
          <h3>评审任务全部完成！</h3>
          <p class="muted" style="margin-top: 10px;">您已完成 ${myScoredIds.size} 件作品的评审工作。</p>
          <div class="actions" style="margin-top: 20px; justify-content: center;">
            <button class="btn btn-primary" onclick="LisztModal.close();location.reload();">查看评审结果</button>
          </div>
        </div>
      `, { title: '评审完成' });
    }
  }

  // =============== 过滤事件 ===============
  ['filterGroup', 'filterMajor', 'filterText', 'filterStatus'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderList);
  });

  // =============== 移动端 tab 切换 ===============
  document.querySelectorAll('.mobile-tabs button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.mobile-tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if (b.dataset.mt === 'list') {
        document.getElementById('pendingList').classList.add('mobile-show');
        document.getElementById('scoreMain').classList.add('mobile-hide');
      } else {
        document.getElementById('pendingList').classList.remove('mobile-show');
        document.getElementById('scoreMain').classList.remove('mobile-hide');
      }
    });
  });

  // =============== 快捷键 ===============
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      const submitBtn = document.getElementById('btnSubmit');
      if (submitBtn) { e.preventDefault(); submitBtn.click(); }
    }
  });

  // =============== 启动 ===============
  renderHead();
  renderList();
})();
</script>
</body>
</html>
